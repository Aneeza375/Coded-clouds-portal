<!DOCTYPE html>
<html>
<head>
    <title>Admin - Create User</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-900 text-white flex">
    <div class="w-60 h-screen bg-slate-800 p-5">
        <h2 class="text-xl font-bold text-sky-400 mb-6">A Panel (Admin)</h2>
        <ul class="space-y-3">
            <li><a href="admin.html" class="block p-2 hover:bg-slate-700 rounded">Dashboard</a></li>
            <li><a href="create-user.html" class="block bg-sky-600 p-2 rounded font-semibold">➕ Create User</a></li>
            <li><a href="login.html" class="block bg-red-600 text-center p-2 rounded mt-10">Logout</a></li>
        </ul>
    </div>
    <div class="p-10 flex-1">
        <h1 class="text-2xl font-bold mb-5">Create User / Add Employee</h1>
        
        <form class="bg-slate-800 p-6 rounded max-w-md space-y-4 border border-slate-700 shadow-md">
            <div>
                <label class="block text-xs text-gray-400 mb-1">Employee Name</label>
                <input type="text" placeholder="Enter Full Name" class="w-full p-2 bg-slate-900 border border-slate-700 rounded focus:outline-none focus:border-sky-500">
            </div>
            <div>
                <label class="block text-xs text-gray-400 mb-1">Employee Email Address</label>
                <input type="email" placeholder="user@codedclouds.com" class="w-full p-2 bg-slate-900 border border-slate-700 rounded focus:outline-none focus:border-sky-500">
            </div>
            <div>
                <label class="block text-xs text-gray-400 mb-1">Assign Role Panel</label>
                <select class="w-full p-2 bg-slate-900 border border-slate-700 rounded text-gray-400 focus:outline-none focus:border-sky-500">
                    <option>HR (B Panel)</option>
                    <option>Design (C Panel)</option>
                    <option>Developer (D Panel)</option>
                    <option>Marketing (E Panel)</option>
                </select>
            </div>
            <button type="button" onclick="alert('User Created Successfully!')" class="w-full bg-sky-500 p-2 rounded font-bold hover:bg-sky-600 transition">Add Employee</button>
        </form>
    </div>
</body>
</html>
