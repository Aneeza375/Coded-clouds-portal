<!DOCTYPE html>
<html>
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>Login page</title>
        <script src="https://cdn.tailwindcss.com"></script>
        <style>
           /* password buton ka color white */
        input[type="password"]::-ms-reveal,
        input[type="password"]::-webkit-credentials-auto-fill-button {
            filter: invert(1); 
        }
    </style>
    </head>
<body class="bg-[#05070b] text-white min-h-screen flex flex-col md:flex-row overflow-hidden">

   <div class="hidden md:flex md:w-1/2 relative items-center justify-center bg-[#06080c]">
        <!-- vedio loop h or mute -->
        <video autoplay loop muted playsinline class="absolute inset-0 w-full h-full object-cover opacity-60">
            <source src="BG-tec.mp4" type="video/mp4">
        </video>
        <!--logo or tagline h neechy -->
        <div class="relative z-10 text-center px-4">
            <img src="logo.png" alt="Logo" class="h-20 w-auto mx-auto mb-1 opacity-95">
            <p class="text-[10px] text-slate-400 tracking-wider uppercase font-bold">YOUR CLOUD, OUR CODE</p>
        </div>

    </div>
    </div>

    <div class="w-full md:w-1/2 flex items-center justify-center p-12 sm:p-16 bg-[#090c14]">
        
        <div class="w-full max-w-[380px]">
            <h2 class="text-xl font-bold mb-6">Sign In</h2>
            <!--form And  palceholders-->
            <form style="margin-top: 20px;">

    <div style="margin-bottom: 15px;">
    <label class="block text-xs font-semibold text-slate-400 mb-2">Email Address</label>
    <input type="email" id="email" placeholder="Enter Email Address" required
           class="w-full px-3 py-2 text-xs rounded-lg bg-[#121622] border border-slate-850 text-white focus:outline-none">
</div>

<div style="margin-bottom: 20px;">
    <label class="block text-xs font-semibold text-slate-400 mb-2">Password</label>
    <input type="password" id="password" placeholder="Enter password" required
           class="w-full px-3 py-2 text-xs rounded-lg bg-[#121622] border border-slate-850 text-white focus:outline-none">
</div>
    <!--Login button of   login page -->
    <button onclick="checkLogin(event)" class="bg-[#00a8e8] text-white w-full py-2 rounded-lg font-semibold">
    Login
</button>

</form>
            
            </div>

    </div>

</body>
<script>
  function checkLogin(event) {
    // Page ko reload hone se rokne ke liye
    event.preventDefault(); 
    
    const email = document.getElementById('email').value.trim();
    const password = document.getElementById('password').value;

    if (!email || !password) {
      alert("All fields are required!");
      return;
    }

    <!--Role k according access--->
    switch (email) {
  case "admin@codedclouds.com": window.location.href = "admin.html";break;
  case "hr@codedclouds.com":window.location.href = "hr.html"; break;
  case "designer@codedclouds.com":window.location.href = "designer.html";break; 
  case "developer@codedclouds.com":window.location.href = "developer.html";break;
  case "marketing@codedclouds.com":window.location.href = "marketing.html";break;
  default: alert("Invalid Authorized User!");
}
  }
</script>
